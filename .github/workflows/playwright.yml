name: QA Automation Pipeline

run-name: QA Automation Pipeline - ${{ github.event.head_commit.message || github.event.pull_request.title || github.event_name }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *' # nightly, 03:00 UTC: cross-browser + stability checks
  workflow_dispatch:

# Cancel an older run of the same branch when a newer commit is pushed
concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Run JavaScript actions on Node 24 (Node 20 is deprecated on GitHub runners)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 1. Fast quality gate: fails in seconds on style or type problems, before any browser starts
  quality:
    name: Lint, format and type check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: TypeScript
        run: npm run typecheck

  # 2. Full regression: every UI test (Chromium) + both API suites
  test:
    name: UI + API tests
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Install browser (Chromium)
        run: npx playwright install --with-deps chromium
      - name: Run UI and API tests
        run: npm run test:ci
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # 3. Nightly only: UI tests in Firefox and WebKit
  cross-browser:
    name: UI on ${{ matrix.browser }} (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run UI tests
        run: npx playwright test --project=${{ matrix.browser }} --grep-invert @quarantine
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14

  # 4. Nightly only: run everything 5 times to expose flaky tests
  stability:
    name: Flakiness check (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Repeat the suite 5 times, no retries
        run: npm run test:stability
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: report-stability
          path: playwright-report/
          retention-days: 14
