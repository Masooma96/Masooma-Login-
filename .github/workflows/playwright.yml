name: UI Test Suite

run-name: UI Test Suite - ${{ github.event.head_commit.message || github.event.pull_request.title || 'manual run' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel an older run of the same branch when a newer commit is pushed
concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run UI tests (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Install browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
