name: UI Test Suite

run-name: UI Test Suite - ${{ github.event.head_commit.message || github.event.pull_request.title || 'manual run' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel an older run of the same branch when a newer commit is pushed
concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Run JavaScript actions on Node 24 (Node 20 is deprecated on GitHub runners)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Run UI tests (Chrome)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Install browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run UI (login) and API tests
        run: npm run test:suite

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
